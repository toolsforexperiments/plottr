name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    # Installs the system libraries Qt needs, starts Xvfb and exports DISPLAY.
    - uses: pyvista/setup-headless-display-action@v5
      with:
        qt: true
        pyvista: false
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - uses: ./.github/actions/install-dependencies-and-plottr
    - name: Run Mypy
      run: mypy plottr
    - name: Test with pytest
      run: |
        pytest test/pytest
